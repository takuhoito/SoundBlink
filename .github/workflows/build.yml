name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Skip changes that cannot affect the app. Path filters are not evaluated
    # for tag pushes, so releases always build.
    paths-ignore:
      - "site/**"
      - "**/*.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - "**/*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: swift --version

      - name: Build app
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          export BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          scripts/build-app.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SoundBlink
          path: build/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SoundBlink

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A copy without the version in its name gives the website a link
          # that always downloads the latest release:
          # https://github.com/<repo>/releases/latest/download/SoundBlink.zip
          cp SoundBlink-*.zip SoundBlink.zip
          gh release create "$GITHUB_REF_NAME" ./*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "SoundBlink ${GITHUB_REF_NAME#v}" \
            --generate-notes
