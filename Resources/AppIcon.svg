<?xml version="1.0" encoding="UTF-8"?>
<!-- SoundBlink app icon (source). Render with scripts/make-icons.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E73FF"/>
      <stop offset="1" stop-color="#2E2A9E"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="244" y1="244" x2="780" y2="780">
      <stop offset="0" stop-color="#FFD866"/>
      <stop offset="1" stop-color="#FF9B3D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1A1460" flood-opacity="0.35"/>
    </filter>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185.4"/>
    </clipPath>
  </defs>

  <!-- Body -->
  <rect id="squircle" x="100" y="100" width="824" height="824" rx="185.4" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" fill="url(#gloss)" clip-path="url(#body)"/>

  <g filter="url(#glyphShadow)">
    <!-- Reset arrows -->
    <g fill="none" stroke="url(#ring)" stroke-width="52" stroke-linecap="round">
      <path d="M260.16,420.34 A268,268 0 0 1 763.84,420.34"/>
      <path d="M763.84,603.66 A268,268 0 0 1 260.16,603.66"/>
    </g>
    <g fill="url(#ring)" stroke="url(#ring)" stroke-width="10" stroke-linejoin="round">
      <path d="M786.41,482.36 L812.36,389.91 L707.12,428.21 Z"/>
      <path d="M237.59,541.64 L211.64,634.09 L316.88,595.79 Z"/>
    </g>

    <!-- Speaker -->
    <g transform="translate(512 512) scale(1.25) translate(-512 -512)">
      <path d="M382,462 H442 L530,392 V632 L442,562 H382 Z"
            fill="#FFFFFF" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round">
