<?xml version="1.0" encoding="UTF-8"?>
<!-- SoundBlink app icon (source). Render with scripts/make-icons.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="92 92 840 840">
  <defs>
    <!-- sRGB keeps the filter from crushing dark tones into bands. -->
    <filter id="shadow" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Body: flat dark tile on the standard macOS icon grid (824 px, radius 185.4) -->
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="#000000" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="#1C1C1E"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>

  <!-- Reset arrows -->
  <g fill="none" stroke="#8E8E93" stroke-width="52" stroke-linecap="round">
    <path d="M260.16,420.34 A268,268 0 0 1 763.84,420.34"/>
    <path d="M763.84,603.66 A268,268 0 0 1 260.16,603.66"/>
  </g>
  <g fill="#8E8E93" stroke="#8E8E93" stroke-width="10" stroke-linejoin="round">
    <path d="M786.41,482.36 L812.36,389.91 L707.12,428.21 Z"/>
    <path d="M237.59,541.64 L211.64,634.09 L316.88,595.79 Z"/>
  </g>

  <!-- Speaker -->
  <g transform="translate(512 512) scale(1.25) translate(-512 -512)">
    <path d="M382,462 H442 L530,392 V632 L442,562 H382 Z"
          fill="#F2F2F7" stroke="#F2F2F7" stroke-width="20" stroke-linejoin="round"/>
    <g fill="none" stroke="#F2F2F7" stroke-width="24" stroke-linecap="round">
      <path d="M568.4,472.2 A52,52 0 0 1 568.4,551.8"/>
      <path d="M599.3,435.4 A100,100 0 0 1 599.3,588.6"/>
    </g>
  </g>
</svg>
